[project]
name = "glassbox-md"
version = "0.1.0"
description = "Explainable medical AI agent pipeline (educational/portfolio project -- not a medical device)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
