name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    name: lock file matches requirements.txt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Recompiles requirements.txt with the committed pins as preferences
      # (uv keeps an existing output file's versions when they still
      # satisfy the input), so this only fails when requirements.txt was
      # edited without regenerating the lock, or a pinned version vanished.
      # The first two lines are a header that names the output file.
      - name: Recompile and compare
        run: |
          pip install uv
          cp requirements.lock.txt /tmp/relock.txt
          uv pip compile requirements.txt --universal --python-version 3.11 -o /tmp/relock.txt
          diff <(tail -n +3 requirements.lock.txt) <(tail -n +3 /tmp/relock.txt) \
            || { echo "::error::requirements.lock.txt is out of date -- regenerate it (command in requirements.txt's header)"; exit 1; }

  # The cath-lab simulator (simulator/): typecheck, unit tests and a production build, on the oldest and a
  # current Node. `npm ci` installs exactly what package-lock.json says.
  simulator:
    name: simulator (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The same sources built for a standalone static host (base "/"), so that script cannot rot unnoticed.
      - name: Standalone build
        run: npm run build:standalone

  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        # latest = requirements.txt (newest compatible versions, catches
        # upstream breakage early); locked = requirements.lock.txt (the
        # exact resolution a fresh clone is told to use).
        deps: [latest, locked]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt

      - name: Install dependencies (latest compatible)
        if: matrix.deps == 'latest'
        run: pip install -r requirements.txt

      - name: Install dependencies (locked)
        if: matrix.deps == 'locked'
        run: pip install -r requirements.lock.txt

      # en_core_web_lg is what Presidio's default AnalyzerEngine() loads;
      # installing it here keeps the tests from depending on Presidio's
      # silent runtime auto-download.
      - name: Install spaCy model and the project itself
        run: |
          python -m spacy download en_core_web_lg
          pip install -e . --no-deps

      # ChromaDB's default embedding function downloads a ~80MB ONNX model on
      # first use; caching it keeps the RAG tests from re-fetching every run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-minilm-${{ runner.os }}

      # Build the simulator so tests/test_cathlab_real_build.py can check that the Glassbox app serves the
      # real build (asset paths, the lazily loaded lab chunk), not just a stand-in.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Build the cath-lab simulator
        run: |
          npm ci
          npm run build
        working-directory: simulator

      - name: Run tests
        run: pytest -q
