name: Dependency audit

# Separate from CI on purpose: a newly published advisory should raise a
# flag on its own schedule, not turn an unrelated pull request red.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - requirements.txt
      - requirements.lock.txt
      - simulator/package-lock.json
      - .github/workflows/security-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the exact pinned versions in the lock file. The four
      # chromadb IDs below are all advisories against ChromaDB's *server*
      # mode (pre-auth code injection, tenant/RBAC checks). This project
      # only uses the embedded in-process PersistentClient and never runs
      # a Chroma server, and the advisories list no fixed release
      # (last_affected = latest). Remove these ignores once a fix ships.
      - name: Audit locked dependencies
        run: >
          pip-audit -r requirements.lock.txt --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

  # The simulator's npm dependencies (Three.js, Vite, Vitest, TypeScript). Only high and critical advisories
  # fail the job; the build tools run on a developer machine or in CI and never ship to the browser.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit the simulator's locked dependencies
        run: npm audit --audit-level=high
        working-directory: simulator
