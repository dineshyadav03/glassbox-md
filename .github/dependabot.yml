version: 2
updates:
  # GitHub Actions versions only. The pip ecosystem is deliberately not
  # configured: requirements.lock.txt is a *compiled* resolution, and
  # Dependabot patches one pin at a time without re-resolving, which leaves
  # the lock internally inconsistent (its first PRs bumped thinc 8 -> 9
  # against a spaCy that requires thinc < 8.4, and every "locked" CI job
  # failed). Refresh the lock with `uv pip compile ... --upgrade` instead
  # (command in requirements.txt's header); the weekly pip-audit workflow
  # is the advisory signal.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The cath-lab simulator. Unlike pip, npm's package-lock.json is resolved by npm itself, so Dependabot's
  # one-package-at-a-time updates keep it consistent; CI (typecheck, tests, build) is the safety net.
  - package-ecosystem: npm
    directory: /simulator
    schedule:
      interval: weekly
    groups:
      simulator-dev-tools:
        dependency-type: development
